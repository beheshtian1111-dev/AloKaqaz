<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الو کاغذ | رزرو بازدید رایگان</title>
<style>
  :root{
    --cream:#F8F1E7;
    --maroon:#6B2C2C;
    --maroon-dark:#4E1F1F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Vazirmatn','Tahoma',sans-serif;
    background:var(--cream);
    color:var(--maroon-dark);
    min-height:100vh;
  }
  .wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px;}
  .logo{display:block;width:120px;margin:0 auto 6px;}
  h1{text-align:center;font-size:22px;margin:0 0 2px;color:var(--maroon);}
  .tagline{text-align:center;font-size:13px;color:var(--maroon-dark);opacity:.75;margin-bottom:24px;}
  .card{
    background:#fff;
    border-radius:18px;
    padding:20px 18px;
    box-shadow:0 6px 20px rgba(107,44,44,.12);
    margin-bottom:16px;
  }
  label{display:block;font-size:14px;margin:14px 0 6px;font-weight:600;}
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%;
    padding:12px 14px;
    border:1.5px solid #e6dcca;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    background:var(--cream);
    color:var(--maroon-dark);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--maroon);}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .style-pick{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .style-pick label{
    flex:1 1 calc(50% - 5px);text-align:center;border:1.5px solid #e6dcca;border-radius:10px;
    padding:12px 4px;font-size:14px;font-weight:500;cursor:pointer;margin:0;
  }
  .style-pick input{display:none;}
  .style-pick input:checked + span{color:var(--maroon);font-weight:700;}
  .style-pick label:has(input:checked){border-color:var(--maroon);background:#f3e9e0;}
  button{
    width:100%;
    padding:15px;
    background:var(--maroon);
    color:var(--cream);
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    margin-top:22px;
    cursor:pointer;
    font-family:inherit;
  }
  button:active{background:var(--maroon-dark);}
  button:disabled{opacity:.6;}
  .success{
    display:none;
    text-align:center;
    padding:40px 20px;
  }
  .success .check{font-size:52px;margin-bottom:14px;}
  .success h2{color:var(--maroon);margin-bottom:8px;}
  .success p{color:var(--maroon-dark);opacity:.8;line-height:1.9;}
  .foot{text-align:center;font-size:12px;color:var(--maroon-dark);opacity:.55;margin-top:20px;}
  .fee-box{
    background:#f3e9e0;
    border:1.5px solid #e6d3c0;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
    font-size:13.5px;
    line-height:2;
    color:var(--maroon-dark);
  }
  .fee-box b{color:var(--maroon);}
  .required{color:var(--maroon);}
  .err{color:#b71c1c;font-size:12px;margin-top:4px;display:none;}
</style>
</head>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ⚠️ آدرس و کلید Supabase پروژه‌ت رو اینجا جایگزین کن (از Project Settings > API)
  const SUPABASE_URL = "https://npexvdwkgdzwfnbfluji.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_o-JBZ8GP-TWfBcMWhkQK1g_vt3-wuKe";
  let supabaseClient = null;
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e){
    console.warn("خطا در اتصال به Supabase:", e);
  }

  // ---- تقویم شمسی (جلالی) بدون کتابخونه خارجی ----
  const PERSIAN_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

  function isJalaliLeap(jy){
    // الگوریتم ساده تعیین سال کبیسه شمسی (33 ساله)
    const breaks = [1,5,9,13,17,22,26,30];
    const cycle = jy % 33;
    return breaks.includes(cycle);
  }

  function daysInJalaliMonth(jy, jm){
    if(jm <= 6) return 31;
    if(jm <= 11) return 30;
    return isJalaliLeap(jy) ? 30 : 29;
  }

  function getCurrentJalali(){
    // با Intl تاریخ جلالی امروز رو می‌گیریم
    const parts = new Intl.DateTimeFormat('en-US-u-ca-persian', { year:'numeric', month:'numeric', day:'numeric' })
      .formatToParts(new Date());
    const obj = {};
    parts.forEach(p => { if(p.type !== 'literal') obj[p.type] = parseInt(p.value); });
    return { jy: obj.year, jm: obj.month, jd: obj.day };
  }

  function setupJalaliPicker(){
    const daySel = document.getElementById('visitDay');
    const monthSel = document.getElementById('visitMonth');
    const yearSel = document.getElementById('visitYear');
    const today = getCurrentJalali();

    // سال: امسال و سال بعد
    [today.jy, today.jy + 1].forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      yearSel.appendChild(opt);
    });

    // ماه
    PERSIAN_MONTHS.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = i + 1; opt.textContent = m;
      monthSel.appendChild(opt);
    });
    monthSel.value = today.jm;

    function fillDays(){
      const jy = parseInt(yearSel.value);
      const jm = parseInt(monthSel.value);
      const maxDay = daysInJalaliMonth(jy, jm);
      const prevVal = parseInt(daySel.value) || today.jd;
      daySel.innerHTML = "";
      for(let d = 1; d <= maxDay; d++){
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        daySel.appendChild(opt);
      }
      daySel.value = Math.min(prevVal, maxDay);
    }

    fillDays();
    daySel.value = today.jd;
    yearSel.addEventListener('change', fillDays);
    monthSel.addEventListener('change', fillDays);
  }
  setupJalaliPicker();

  function getSelectedJalaliDate(){
    const d = document.getElementById('visitDay').value;
    const m = document.getElementById('visitMonth').value;
    const y = document.getElementById('visitYear').value;
    const monthName = PERSIAN_MONTHS[parseInt(m) - 1];
    return `${d} ${monthName} ${y}`;
  }

  function submitBooking(){
    const fullname = document.getElementById('fullname').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const area = document.getElementById('area').value.trim();
    const rooms = document.getElementById('rooms').value.trim();
    const style = Array.from(document.querySelectorAll('input[name="style"]:checked')).map(el => el.value).join('، ');
    const visitDate = getSelectedJalaliDate();
    const visitTime = document.getElementById('visitTime').value;
    const notes = document.getElementById('notes').value.trim();
    const errMsg = document.getElementById('errMsg');

    if(!fullname || !phone || !address){
      errMsg.textContent = "لطفاً نام، شماره تماس و آدرس رو کامل وارد کن";
      errMsg.style.display = "block";
      return;
    }
    if(!/^0?9\d{9}$/.test(phone.replace(/\s/g,''))){
      errMsg.textContent = "شماره تماس معتبر نیست";
      errMsg.style.display = "block";
      return;
    }
    errMsg.style.display = "none";

    if(!supabaseClient){
      errMsg.textContent = "اتصال به دیتابیس هنوز تنظیم نشده — بعد از وصل کردن Supabase فعال می‌شه";
      errMsg.style.display = "block";
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "در حال ثبت...";

    supabaseClient.from('bookings').insert([{
      fullname, phone, address,
      area: area || null,
      rooms: rooms || null,
      style,
      visit_date: visitDate || null,
      visit_time: visitTime,
      notes: notes || null,
      status: "در انتظار"
    }]).then(({ error }) => {
      if(error){
        errMsg.textContent = "خطا در ثبت درخواست، دوباره تلاش کن";
        errMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "ثبت درخواست بازدید";
        console.error(error);
        return;
      }
      document.getElementById('formCard').style.display = "none";
      document.getElementById('successCard').style.display = "block";
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | الو کاغذ</title>
<style>
  :root{
    --cream:#F7F1EA;
    --maroon:#6D0626;
    --maroon-dark:#4a041a;
    --glass-bg: rgba(255,255,255,0.55);
    --glass-border: rgba(255,255,255,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn','Tahoma',sans-serif;
    color:var(--maroon-dark);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(109,6,38,0.16), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(109,6,38,0.10), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(109,6,38,0.14), transparent 50%),
      var(--cream);
    background-attachment:fixed;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 14px 60px;}
  .logo-block{text-align:center;margin-bottom:18px;}
  .logo{display:block;width:76px;margin:0 auto 6px;filter:drop-shadow(0 6px 14px rgba(109,6,38,.18));}
  h1{text-align:center;font-size:18px;color:var(--maroon);margin:0 0 20px;font-weight:800;}

  .glass{
    background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(109,6,38,.10), inset 0 1px 0 rgba(255,255,255,.5);
  }

  #loginBox{max-width:320px;margin:60px auto;padding:28px;}
  #loginBox input{
    width:100%;padding:12px;border:1.5px solid rgba(109,6,38,.15);border-radius:12px;
    font-size:15px;margin-bottom:12px;background:rgba(255,255,255,.65);color:var(--maroon-dark);
  }
  #loginBox input:focus{outline:none;border-color:var(--maroon);background:rgba(255,255,255,.9);}
  #loginBox button{
    width:100%;padding:13px;background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 10px 24px rgba(109,6,38,.25);
  }
  #loginErr{color:#b71c1c;font-size:13px;text-align:center;margin-top:10px;display:none;}

  #panel{display:none;}
  .filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .filters button{
    white-space:nowrap;padding:9px 18px;border-radius:20px;border:1.5px solid rgba(109,6,38,.25);
    background:rgba(255,255,255,.5);color:var(--maroon);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
    backdrop-filter:blur(10px);
  }
  .filters button.active{background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));color:#fff;border-color:transparent;}

  .card{padding:18px;margin-bottom:14px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .name{font-weight:800;font-size:16px;color:var(--maroon);}
  .phone a{color:var(--maroon-dark);text-decoration:none;font-size:14px;}
  .badge{font-size:11px;padding:5px 12px;border-radius:12px;font-weight:800;white-space:nowrap;}
  .badge.pending{background:rgba(253,236,200,.85);color:#8a5a00;}
  .badge.confirmed{background:rgba(220,239,225,.85);color:#1e6b3a;}
  .badge.done{background:rgba(226,226,226,.85);color:#555;}
  .detail{font-size:13.5px;line-height:2.1;color:var(--maroon-dark);}
  .detail b{color:var(--maroon);}
  .actions{display:flex;gap:8px;margin-top:14px;}
  .actions select{
    flex:1;padding:10px;border-radius:10px;border:1.5px solid rgba(109,6,38,.15);
    font-size:13px;font-family:inherit;background:rgba(255,255,255,.65);color:var(--maroon-dark);
  }
  .actions a.callbtn{
    padding:10px 16px;background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color:#fff;border-radius:10px;text-decoration:none;font-size:13px;font-weight:800;
    box-shadow:0 6px 16px rgba(109,6,38,.22);
  }
  .empty{text-align:center;padding:44px 10px;opacity:.6;}
  .count{font-size:13px;color:var(--maroon-dark);opacity:.7;margin-bottom:12px;}
  .phone-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;margin-bottom:8px;
  }
  .phone-row .pname{font-weight:700;color:var(--maroon);font-size:14px;}
  .phone-row .pnum a{color:var(--maroon-dark);text-decoration:none;font-size:14px;direction:ltr;display:inline-block;}
  .phone-row .pcount{font-size:11px;color:var(--maroon-dark);opacity:.6;}
</style>
</head>

  <h1>پنل مدیریت درخواست‌ها</h1>

  <div id="loginBox" class="glass">
    <input type="password" id="pwd" placeholder="رمز عبور">
    <button onclick="login()">ورود</button>
    <div id="loginErr">رمز اشتباه است</div>
  </div>

  <div id="panel">
    <div class="filters" style="margin-bottom:10px;">
      <button class="active" data-v="requests" onclick="setView('requests')">📋 درخواست‌ها</button>
      <button data-v="phonebank" onclick="setView('phonebank')">📱 بانک شماره</button>
    </div>

    <div id="requestsView">
      <div class="filters">
        <button class="active" data-f="همه" onclick="setFilter('همه')">همه</button>
        <button data-f="در انتظار" onclick="setFilter('در انتظار')">در انتظار</button>
        <button data-f="تایید شده" onclick="setFilter('تایید شده')">تایید شده</button>
        <button data-f="انجام شده" onclick="setFilter('انجام شده')">انجام شده</button>
      </div>
      <div class="count" id="countBox"></div>
      <div id="list"></div>
    </div>

    <div id="phonebankView" style="display:none;">
      <div class="glass" style="padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="count" id="phoneCountBox" style="margin:0;"></div>
        <button onclick="downloadPhoneCSV()" style="padding:9px 16px;background:linear-gradient(135deg, var(--maroon), var(--maroon-dark));color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(109,6,38,.22);">⬇ دانلود CSV</button>
      </div>
      <div id="phoneList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://npexvdwkgdzwfnbfluji.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_o-JBZ8GP-TWfBcMWhkQK1g_vt3-wuKe";
  let supabaseClient = null;
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e){
    console.warn("خطا در اتصال به Supabase:", e);
  }

  const ADMIN_PASSWORD = "alokaghaz-admin-1404"; // ⚠️ رمز پنل مدیریت - قابل تغییر

  let currentFilter = "همه";
  let allBookings = [];

  function login(){
    const val = document.getElementById('pwd').value;
    if(val === ADMIN_PASSWORD){
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('panel').style.display = "block";
      if(!supabaseClient){
        document.getElementById('list').innerHTML = "<div class='empty'>اتصال به دیتابیس هنوز تنظیم نشده — بعد از وصل کردن Supabase فعال می‌شه</div>";
        return;
      }
      loadBookings();
    } else {
      document.getElementById('loginErr').style.display = "block";
    }
  }

  function setFilter(f){
    currentFilter = f;
    document.querySelectorAll('#requestsView .filters button').forEach(b => b.classList.toggle('active', b.dataset.f === f));
    render();
  }

  function setView(v){
    document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('active', b.dataset.v === v));
    document.getElementById('requestsView').style.display = v === 'requests' ? 'block' : 'none';
    document.getElementById('phonebankView').style.display = v === 'phonebank' ? 'block' : 'none';
    if(v === 'phonebank') renderPhoneBank();
  }

  function getUniquePhones(){
    const map = new Map();
    allBookings.forEach(b => {
      if(!b.phone) return;
      if(!map.has(b.phone)){
        map.set(b.phone, { name: b.fullname || '-', phone: b.phone, count: 1 });
      } else {
        map.get(b.phone).count++;
      }
    });
    return Array.from(map.values());
  }

  function renderPhoneBank(){
    const phones = getUniquePhones();
    document.getElementById('phoneCountBox').textContent = `${phones.length} شماره یکتا`;
    const list = document.getElementById('phoneList');
    if(phones.length === 0){
      list.innerHTML = "<div class='empty'>هنوز شماره‌ای ثبت نشده</div>";
      return;
    }
    list.innerHTML = phones.map(p => `
      <div class="glass phone-row">
        <div>
          <div class="pname">${p.name}</div>
          <div class="pcount">${p.count} درخواست</div>
        </div>
        <div class="pnum"><a href="tel:${p.phone}">${p.phone}</a></div>
      </div>
    `).join('');
  }

  function downloadPhoneCSV(){
    const phones = getUniquePhones();
    let csv = "\uFEFFنام,شماره تماس,تعداد درخواست\n";
    phones.forEach(p => {
      csv += `"${p.name}","${p.phone}",${p.count}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'بانک-شماره-الو-کاغذ.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function fetchBookings(){
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*')
      .order('created_at', { ascending: false });
    if(error){
      document.getElementById('list').innerHTML = "<div class='empty'>خطا در دریافت اطلاعات از Supabase</div>";
      console.error(error);
      return;
    }
    allBookings = data;
    render();
    if(document.getElementById('phonebankView').style.display !== 'none'){
      renderPhoneBank();
    }
  }

  function loadBookings(){
    fetchBookings();
    supabaseClient
      .channel('bookings-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => {
        fetchBookings();
      })
      .subscribe();
  }

  function badgeClass(status){
    if(status === "تایید شده") return "confirmed";
    if(status === "انجام شده") return "done";
    return "pending";
  }

  function render(){
    const filtered = currentFilter === "همه" ? allBookings : allBookings.filter(b => b.status === currentFilter);
    document.getElementById('countBox').textContent = `${filtered.length} درخواست`;
    const list = document.getElementById('list');

    if(filtered.length === 0){
      list.innerHTML = "<div class='empty'>درخواستی وجود ندارد</div>";
      return;
    }

    list.innerHTML = filtered.map(b => `
      <div class="card glass">
        <div class="card-top">
          <div>
            <div class="name">${b.fullname || '-'}</div>
            <div class="phone"><a href="tel:${b.phone}">${b.phone || '-'}</a></div>
          </div>
          <span class="badge ${badgeClass(b.status)}">${b.status || 'در انتظار'}</span>
        </div>
        <div class="detail">
          <div><b>آدرس:</b> ${b.address || '-'}</div>
          <div><b>متراژ:</b> ${b.area || '-'} متر &nbsp; | &nbsp; <b>اتاق:</b> ${b.rooms || '-'}</div>
          <div><b>سبک:</b> ${b.style || '-'}</div>
          <div><b>روز/ساعت پیشنهادی:</b> ${b.visit_date || 'مشخص نشده'} — ${b.visit_time || '-'}</div>
          ${b.notes ? `<div><b>توضیحات:</b> ${b.notes}</div>` : ''}
        </div>
        <div class="actions">
          <select onchange="updateStatus('${b.id}', this.value)">
            <option ${b.status === 'در انتظار' ? 'selected' : ''} value="در انتظار">در انتظار</option>
            <option ${b.status === 'تایید شده' ? 'selected' : ''} value="تایید شده">تایید شده</option>
            <option ${b.status === 'انجام شده' ? 'selected' : ''} value="انجام شده">انجام شده</option>
          </select>
          <a class="callbtn" href="tel:${b.phone}">تماس</a>
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(id, status){
    await supabaseClient.from('bookings').update({ status }).eq('id', id);
  }
</script>
</body>
</html>

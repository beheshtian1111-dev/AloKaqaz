<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | الو کاغذ</title>
<style>
  :root{
    --cream:#ffffff;
    --maroon:#659BB9;
    --maroon-dark:#3d6f8c;
    --accent:#95baeb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Vazirmatn','Tahoma',sans-serif;background:var(--cream);color:var(--maroon-dark);}
  .wrap{max-width:720px;margin:0 auto;padding:20px 14px 60px;}
  .logo{display:block;width:80px;margin:0 auto 4px;}
  h1{text-align:center;font-size:19px;color:var(--maroon);margin:0 0 20px;}

  /* login */
  #loginBox{max-width:320px;margin:60px auto;background:#fff;padding:26px;border-radius:16px;box-shadow:0 6px 20px rgba(101,155,185,.18);}
  #loginBox input{width:100%;padding:12px;border:1.5px solid #dbe7ee;border-radius:10px;font-size:15px;margin-bottom:12px;background:#f4f8fb;color:var(--maroon-dark);}
  #loginBox button{width:100%;padding:12px;background:var(--maroon);color:var(--cream);border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  #loginErr{color:#b71c1c;font-size:13px;text-align:center;margin-top:8px;display:none;}

  #panel{display:none;}
  .filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .filters button{
    white-space:nowrap;padding:8px 16px;border-radius:20px;border:1.5px solid var(--maroon);
    background:#fff;color:var(--maroon);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .filters button.active{background:var(--maroon);color:#fff;}

  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(101,155,185,.15);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .name{font-weight:700;font-size:16px;color:var(--maroon);}
  .phone a{color:var(--maroon-dark);text-decoration:none;font-size:14px;}
  .badge{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:700;white-space:nowrap;}
  .badge.pending{background:#fdecc8;color:#8a5a00;}
  .badge.confirmed{background:#eaf2f7;color:#2a5ba0;}
  .badge.done{background:#e2e2e2;color:#555;}
  .detail{font-size:13.5px;line-height:2;color:var(--maroon-dark);}
  .detail b{color:var(--maroon);}
  .actions{display:flex;gap:8px;margin-top:12px;}
  .actions select{flex:1;padding:9px;border-radius:8px;border:1.5px solid #dbe7ee;font-size:13px;font-family:inherit;background:#f4f8fb;}
  .actions a.callbtn{
    padding:9px 14px;background:var(--maroon);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;
  }
  .empty{text-align:center;padding:40px 10px;opacity:.6;}
  .count{font-size:13px;color:var(--maroon-dark);opacity:.7;margin-bottom:10px;}
</style>
</head>

  <h1>پنل مدیریت درخواست‌ها</h1>

  <div id="loginBox">
    <input type="password" id="pwd" placeholder="رمز عبور">
    <button onclick="login()">ورود</button>
    <div id="loginErr">رمز اشتباه است</div>
  </div>

  <div id="panel">
    <div class="filters">
      <button class="active" data-f="همه" onclick="setFilter('همه')">همه</button>
      <button data-f="در انتظار" onclick="setFilter('در انتظار')">در انتظار</button>
      <button data-f="تایید شده" onclick="setFilter('تایید شده')">تایید شده</button>
      <button data-f="انجام شده" onclick="setFilter('انجام شده')">انجام شده</button>
    </div>
    <div class="count" id="countBox"></div>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ⚠️ همون آدرس و کلید Supabase فایل index.html رو اینجا هم بذار (باید یکی باشن)
  const SUPABASE_URL = "https://npexvdwkgdzwfnbfluji.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_o-JBZ8GP-TWfBcMWhkQK1g_vt3-wuKe";
  let supabaseClient = null;
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e){
    console.warn("خطا در اتصال به Supabase:", e);
  }

  const ADMIN_PASSWORD = "alokaghaz-admin-1404"; // ⚠️ رمز پنل مدیریت - قابل تغییر

  let currentFilter = "همه";
  let allBookings = [];

  function login(){
    const val = document.getElementById('pwd').value;
    if(val === ADMIN_PASSWORD){
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('panel').style.display = "block";
      if(!supabaseClient){
        document.getElementById('list').innerHTML = "<div class='empty'>اتصال به دیتابیس هنوز تنظیم نشده — بعد از وصل کردن Supabase فعال می‌شه</div>";
        return;
      }
      loadBookings();
    } else {
      document.getElementById('loginErr').style.display = "block";
    }
  }

  function setFilter(f){
    currentFilter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.f === f));
    render();
  }

  async function fetchBookings(){
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*')
      .order('created_at', { ascending: false });
    if(error){
      document.getElementById('list').innerHTML = "<div class='empty'>خطا در دریافت اطلاعات از Supabase</div>";
      console.error(error);
      return;
    }
    allBookings = data;
    render();
  }

  function loadBookings(){
    fetchBookings();
    // به‌روزرسانی زنده وقتی درخواست جدید ثبت می‌شه یا وضعیتی تغییر می‌کنه
    supabaseClient
      .channel('bookings-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => {
        fetchBookings();
      })
      .subscribe();
  }

  function badgeClass(status){
    if(status === "تایید شده") return "confirmed";
    if(status === "انجام شده") return "done";
    return "pending";
  }

  function render(){
    const filtered = currentFilter === "همه" ? allBookings : allBookings.filter(b => b.status === currentFilter);
    document.getElementById('countBox').textContent = `${filtered.length} درخواست`;
    const list = document.getElementById('list');

    if(filtered.length === 0){
      list.innerHTML = "<div class='empty'>درخواستی وجود ندارد</div>";
      return;
    }

    list.innerHTML = filtered.map(b => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="name">${b.fullname || '-'}</div>
            <div class="phone"><a href="tel:${b.phone}">${b.phone || '-'}</a></div>
          </div>
          <span class="badge ${badgeClass(b.status)}">${b.status || 'در انتظار'}</span>
        </div>
        <div class="detail">
          <div><b>آدرس:</b> ${b.address || '-'}</div>
          <div><b>متراژ:</b> ${b.area || '-'} متر &nbsp; | &nbsp; <b>اتاق:</b> ${b.rooms || '-'}</div>
          <div><b>سبک:</b> ${b.style || '-'}</div>
          <div><b>روز/ساعت پیشنهادی:</b> ${b.visit_date || 'مشخص نشده'} — ${b.visit_time || '-'}</div>
          ${b.notes ? `<div><b>توضیحات:</b> ${b.notes}</div>` : ''}
        </div>
        <div class="actions">
          <select onchange="updateStatus('${b.id}', this.value)">
            <option ${b.status === 'در انتظار' ? 'selected' : ''} value="در انتظار">در انتظار</option>
            <option ${b.status === 'تایید شده' ? 'selected' : ''} value="تایید شده">تایید شده</option>
            <option ${b.status === 'انجام شده' ? 'selected' : ''} value="انجام شده">انجام شده</option>
          </select>
          <a class="callbtn" href="tel:${b.phone}">تماس</a>
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(id, status){
    await supabaseClient.from('bookings').update({ status }).eq('id', id);
  }
</script>
</body>
</html>
